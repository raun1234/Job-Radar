name: Job Radar

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run job radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTH_STATUS: sponsorship
          JOB_RADAR_SCORE_MODEL: claude-haiku-4-5-20251001
          JOB_RADAR_TOP_THRESHOLD: "75"
          JOB_RADAR_MAX_SPEND: "0.15"
          JOB_RADAR_MAX_AGE_DAYS: "21"
          JOB_RADAR_MAX_YEARS: "8"
        run: python -u search.py

      - name: Commit results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/ seen_jobs.json
          git diff --staged --quiet || git commit -m "Update job radar results $(date -u +%Y-%m-%d)"
          git push
