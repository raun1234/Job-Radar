name: Job Radar

on:
  schedule:
    - cron: "0 13 * * *"   # daily at 13:00 UTC (~9am ET). Edit as you like.
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run job radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTH_STATUS: sponsorship                # sponsorship | authorized | na
          JOB_RADAR_TAILOR_THRESHOLD: 70          # postings scoring at/above this get a full kit
        run: python -u search.py

      - name: Show connection health
        if: always()
        run: |
          if [ -f results/connection_health.json ]; then
            echo "Connection health report saved to results/connection_health.json"
            cat results/connection_health.json
          else
            echo "No connection health report found"
          fi

      - name: Commit results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/ seen_jobs.json
          git diff --staged --quiet || git commit -m "Update job radar results"
          git push
