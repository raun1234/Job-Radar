name: Verify Companies

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Verify all company tokens
        run: python -u verify_companies.py

      - name: Commit verified company list
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add companies.json results/verification_report.json
          git diff --staged --quiet || git commit -m "Verified company list"
          git push
